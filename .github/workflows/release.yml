name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish; must match pyproject.toml"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate release source
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag="v$project_version"

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "$REF_NAME" != "$tag" ]]; then
              echo "Tag $REF_NAME must match pyproject.toml version $tag." >&2
              exit 1
            fi
          elif git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git checkout --detach "$tag"
            project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            if [[ "v$project_version" != "$tag" ]]; then
              echo "The existing tag does not match the version stored at that tag." >&2
              exit 1
            fi
          fi

          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable MAJOR.MINOR.PATCH version; got $project_version." >&2
            exit 1
          fi
          if [[ -n "$INPUT_VERSION" && "$INPUT_VERSION" != "$project_version" ]]; then
            echo "Requested $INPUT_VERSION but checked-out project version is $project_version." >&2
            exit 1
          fi

          echo "version=$project_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$project_version" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install package and developer tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy .

      - name: Test
        run: pytest

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build

      - name: Publish GitHub Release if not already published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; no duplicate will be created."
            exit 0
          fi

          if [[ "$REF_TYPE" == "tag" ]] || git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --repo "$GH_REPO" \
              --title "Event-Driven Metaheuristic Optimization $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* --target "$TARGET_SHA" --repo "$GH_REPO" \
              --title "Event-Driven Metaheuristic Optimization $RELEASE_TAG" --generate-notes
          fi
